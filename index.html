<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafrarts</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
   
</head>
<body>
    <header class="header">
        <a href="#" class="logo"></a>

        <input type="checkbox" id="check">
        <label for="check" class="icons">
            <i class="bx bx-menu" id="menu"></i>
            <i class="bx bx-x" id="close"></i>
        </label>
        
        <nav class="navbar">
            <a href="#home" style="--i:0;">Home</a>
            <a href="#about" style="--i:1;">About Us</a>
            <a href="#creazioni" style="--i:2;">Creazioni</a>
            <a href="#" style="--i:3;">Contact</a>
        </nav>
    </header>

    <!-- HOME -->
    <section id="home">
            <div class="title">
                <h1>
                    <span class="letter" style="--i: 0;">M</span>
                    <span class="letter" style="--i: 1;">A</span>
                    <span class="letter" style="--i: 2;">F</span>
                    <span class="letter" style="--i: 3;">R</span>
                    <span class="letter" style="--i: 4;">A</span>
                    <span class="letter" style="--i: 5;">R</span>
                    <span class="letter" style="--i: 6;">T</span>
                    <span class="letter" style="--i: 7;">S</span>
                </h1>
            </div>
    </section>

    <!-- ABOUT -->
    <section id="about">
        <h2 class="chi-siamo verticalShow">Chi siamo?</h2>
        <div class="about-div horizontalShow">            
            <div class="about-content">
                <h3>La nostra passione</h3>
                <p>Creiamo decorazioni e manufatti unici fatti a mano, pensati su misura per rendere speciale ogni tuo momento. Ogni dettaglio è curato con amore e dedizione.</p>
            </div>
        </div>
    </section>

    <!-- CREATIONS -->
    <div class="creazioni" id="creazioni">
        <div class="product1">
            <div class="description">

            </div>
        </div>
    </div>

    
</body>
</html>
